<body>
<main class="stage">
  <div class="screen s69" id="c69-scr" tabindex="0" aria-label="Founder TD. A tower defense where the map grows with the company. Hire people beside the roads to stop problems reaching Dots.">
    <canvas class="c69-cv"></canvas>
    <div class="c69-hud">
      <div class="c69-name"><b>SAHIL HASAN</b><span>Founder and CEO @ Dots</span></div>
      <div class="c69-mid"><span class="c69-rnd">ROUND 1/13</span><span class="c69-stg">Garage (The Idea)</span><span class="c69-pips"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      <div class="c69-res"><span class="c69-cash">$<b>350</b></span><span class="c69-run"><i></i><b>12.0</b><small>MO RUNWAY</small></span></div>
    </div>
    <div class="c69-tip">Tap a hire to see what it does</div>
    <div class="c69-ban"></div>
    <div class="c69-et" aria-live="polite"></div>
    <div class="c69-toast" aria-live="polite"></div>
    <div class="c69-panel" hidden></div>
    <div class="c69-tray"><div class="c69-cards"></div><div class="c69-ctl"><button type="button" class="c69-ult" hidden aria-label="Global Payout (Sahil)" title="Global Payout (Q)"></button><button type="button" class="c69-ult c69-hot" hidden aria-label="Hotfix (Kartikye)" title="Hotfix (W)">&lt;/&gt;</button><button type="button" class="c69-ff" aria-label="Game speed">1x</button><button type="button" class="c69-go">START</button></div></div>
    <div class="c69-end" hidden></div>
  </div>
</main>
<p class="rotate-hint">Turn your phone sideways for a bigger view</p>
<script src="../assets/shared.js"></script>
<script>
(()=>{
const el=document.getElementById('c69-scr');if(!el)return;
const $=s=>el.querySelector(s);
const cv=$('.c69-cv'),cardsEl=$('.c69-cards'),panel=$('.c69-panel'),ban=$('.c69-ban'),tip=$('.c69-tip'),endEl=$('.c69-end'),ultB=$('.c69-ult'),hotB=$('.c69-hot'),goB=$('.c69-go'),ffB=$('.c69-ff'),toastEl=$('.c69-toast'),etEl=$('.c69-et');
const cashEl=$('.c69-cash b'),runEl=$('.c69-run b'),runBar=$('.c69-run i'),rndEl=$('.c69-rnd'),stgEl=$('.c69-stg'),pipsEl=$('.c69-pips');
const DY=Y,W=1000,H=625,TAU=Math.PI*2,KB='shasan.dots.best',KU='shasan.dots.unl',KR='shasan.dots.runs',KS='shasan.dots.stage',HOT_CD=30,HOT_T=6,CTO='#3fd0c9';
ultB.innerHTML=markSVG('width:58%;height:58%');
const circ=(x,a,b,r)=>{x.beginPath();x.arc(a,b,Math.max(0,r),0,TAU);x.fill()};
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const poly=(x,p)=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath()};
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;

/* ---- lanes: the main road plus branches that open as the company grows ---- */
const MAIN=[[1040,92],[780,92],[780,250],[560,250],[560,112],[330,112],[330,332],[620,332],[620,452],[250,452],[112,392]];
function onSeg(p,a,b){return Math.abs((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]))<1e-6&&p[0]>=Math.min(a[0],b[0])-1e-6&&p[0]<=Math.max(a[0],b[0])+1e-6&&p[1]>=Math.min(a[1],b[1])-1e-6&&p[1]<=Math.max(a[1],b[1])+1e-6}
function mainFrom(p){for(let i=1;i<MAIN.length;i++)if(onSeg(p,MAIN[i-1],MAIN[i])){const r=MAIN.slice(i);return r[0][0]==p[0]&&r[0][1]==p[1]?r:[p,...r]}return[p]}

  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){p.dead=1;continue}
  for(const o of enemies){if(o.dead||p.hit.has(o))continue;if(E[o.k].camo&&!o.decamo&&!p.det)continue;const R=E[o.k].r+7,dx=o.x-p.x,dy=(o.y-(E[o.k].boss?E[o.k].r:10))-p.y;if(dx*dx+dy*dy<=R*R){p.hit.add(o);hit(o,p.dmg,p);if(p.slow)slowE(o,p.slow);if(--p.pier<=0){p.dead=1;break}}}}

  else if(f.k=='clink'){x.strokeStyle='#fff';x.lineWidth=1.6;for(let i=0;i<4;i++){const a=i*1.6+.4;x.beginPath();x.moveTo(f.x,f.y);x.lineTo(f.x+Math.cos(a)*9*u+Math.cos(a)*3,f.y+Math.sin(a)*9*u+Math.sin(a)*3);x.stroke()}}
  else if(f.k=='boom'){x.fillStyle='rgba(253,181,21,.35)';circ(x,f.x,f.y,f.r*(.4+.6*u));x.strokeStyle='#FDB515';x.lineWidth=2.5;x.beginPath();x.arc(f.x,f.y,f.r*(.4+.6*u),0,TAU);x.stroke()}
  else if(f.k=='txt2'){x.fillStyle=CTO;x.strokeStyle='#062222';x.lineWidth=4;x.font="800 20px 'Barlow Condensed',sans-serif";x.textAlign='center';x.strokeText(f.s,f.x,f.y-u*26);x.fillText(f.s,f.x,f.y-u*26)}
  else if(f.k=='txt'){x.fillStyle=DY;x.font="700 22px 'Barlow Condensed',sans-serif";x.textAlign='center';x.fillText(f.s,f.x,f.y-u*30)}
  else if(f.k=='rain'){x.fillStyle=DY;x.strokeStyle='#212121';x.lineWidth=3;x.font="800 20px 'Barlow',sans-serif";x.textAlign='center';x.textBaseline='middle';const yy=f.y-70+70*Math.min(1,u*1.4);x.strokeText(f.g,f.x,yy);x.fillText(f.g,f.x,yy)}
  x.globalAlpha=1}
 if(fog&&!(st.stage>=6&&rev.t>=1)){x.drawImage(fog,0,0,W,H)}
 const tx=cam.x+.905*W/cam.z,ty=cam.y+.05*H/cam.z;
 for(const c of coins){const u=Math.min(1,c.t/.9);let px,py;if(u<.35){px=c.sx;py=c.sy-30*(u/.35)}else{const v=(u-.35)/.65;px=lerp(c.sx,tx,v);py=lerp(c.sy-30,ty,v)}x.fillStyle='#f5c542';circ(x,px,py,8);x.strokeStyle='#a87a12';x.lineWidth=1.5;x.beginPath();x.arc(px,py,8,0,TAU);x.stroke();x.fillStyle='#7a5410';x.font="700 11px 'Barlow Condensed',sans-serif";x.textAlign='center';x.textBaseline='middle';x.fillText('$',px,py+.5)}
 if(placing&&ghost){const b=TT[placing],ok=valid(placing,ghost[0],ghost[1])&&st.cash>=b.c;const R=placing=='sales'?40:b.r;x.fillStyle=ok?'rgba(255,255,255,.1)':'rgba(255,60,60,.16)';x.strokeStyle=ok?'rgba(255,255,255,.55)':'rgba(255,90,90,.8)';x.lineWidth=2;x.beginPath();x.arc(ghost[0],ghost[1]-6,R,0,TAU);x.fill();x.stroke();x.globalAlpha=.7;fig(x,ghost[0],ghost[1],1.65,b,an,{face:1});x.globalAlpha=1}
 x.restore();
 if(st.flash>0){x.fillStyle=`rgba(245,245,67,${st.flash*.35})`;x.fillRect(0,0,w,h)}}

/* ---- input ---- */
function wpos(ev){const r=cv.getBoundingClientRect();return[cam.x+(ev.clientX-r.left)/r.width*W/cam.z,cam.y+(ev.clientY-r.top)/r.height*H/cam.z]}
cv.addEventListener('pointermove',ev=>{if(placing)ghost=wpos(ev)});
cv.addEventListener('pointerleave',()=>{if(!dragArm)ghost=null});
cv.addEventListener('click',ev=>{if(over)return;const[px,py]=wpos(ev);if(placing){ghost=[px,py];tryPlace(placing,px,py);return}
 let ht=null,bd=30;for(const t of towers){const d=Math.hypot(t.x-px,t.y-20-py);if(d<bd){bd=d;ht=t}}if(ht)openPanel(ht);else closePanel()});
let lpT=0,lpDone=false;
cardsEl.addEventListener('pointerdown',ev=>{const c=ev.target.closest('.c69-card');if(!c)return;const kk=c.dataset.k;lpDone=false;
 if(ev.pointerType!=='mouse'){clearTimeout(lpT);lpT=setTimeout(()=>{lpDone=true;showInfo(kk)},420);return}
 if(locked(kk)||placing===kk||over)return;if(onMap(kk))return;placing=kk;dragArm=true;justDown=true;sel=null;showInfo(kk);cardsUpd()});
cardsEl.addEventListener('pointerup',()=>clearTimeout(lpT));cardsEl.addEventListener('pointercancel',()=>clearTimeout(lpT));
cardsEl.addEventListener('contextmenu',ev=>{if(ev.target.closest('.c69-card'))ev.preventDefault()});
cardsEl.addEventListener('pointerover',ev=>{const c=ev.target.closest('.c69-card');if(!c||ev.pointerType!=='mouse'||sel||placing)return;showInfo(c.dataset.k)});
cardsEl.addEventListener('pointerout',ev=>{const c=ev.target.closest('.c69-card');if(!c||ev.pointerType!=='mouse'||placing)return;if(!ev.relatedTarget||!c.contains(ev.relatedTarget))hideInfo()});
el.addEventListener('pointerup',ev=>{if(dragArm){dragArm=false;if(ev.target===cv&&placing){const[px,py]=wpos(ev);tryPlace(placing,px,py);justDown=false}}if(!(ev.target.closest&&ev.target.closest('.c69-card')))justDown=false});
cardsEl.addEventListener('click',ev=>{const c=ev.target.closest('.c69-card');if(!c)return;if(lpDone){lpDone=false;return}if(justDown){justDown=false;return}togglePlacing(c.dataset.k)});
panel.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.classList.contains('c69-x')){closePanel();placing=null;cardsUpd();return}if(!sel)return;if(b.classList.contains('c69-pu'))ult();else if(b.classList.contains('c69-hu'))hotfix();else if(b.classList.contains('c69-up'))upgrade(sel,+b.dataset.p);else if(b.classList.contains('c69-sell'))sell(sel)});
goB.addEventListener('click',startRound);
ffB.addEventListener('click',()=>{st.speed=st.speed==1?3:1;ffB.textContent=st.speed+'x';ffB.classList.toggle('on',st.speed>1)});
ultB.addEventListener('click',ult);hotB.addEventListener('click',hotfix);
endEl.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.classList.contains('c69-again'))newGame();else if(b.classList.contains('c69-wd'))worlds()});
document.addEventListener('keydown',ev=>{const tg=ev.target;if(ev.metaKey||ev.ctrlKey||ev.altKey)return;if(tg&&(tg.tagName=='INPUT'||tg.tagName=='TEXTAREA'||tg.tagName=='SELECT'||tg.isContentEditable))return;const onCtl=tg!==el&&tg!==document.body&&(tg.tagName=='BUTTON'||tg.tagName=='A');const key=ev.key;
 if(/^[0-9]$/.test(key)){const kk=ORDER[key=='0'?9:+key-1];if(kk)togglePlacing(kk);ev.preventDefault();return}
 if(key=='Escape'){placing=null;ghost=null;closePanel();cardsUpd();ev.preventDefault();return}
 if(onCtl)return;
 if(key==' '||key=='Enter'){if(over)newGame();else if(!running)startRound();else ffB.click();ev.preventDefault()}
 else if(key=='f'||key=='F'){ffB.click();ev.preventDefault()}
 else if(key=='q'||key=='Q'){ult();ev.preventDefault()}
 else if(key=='w'||key=='W'){hotfix();ev.preventDefault()}
 else if((key=='u'||key=='i')&&sel){upgrade(sel,key=='u'?0:1);ev.preventDefault()}});

/* ---- boot ---- */
function resize(){V=fit(cv,el);if(!V.w)return;k=V.w/W;buildBG()}
markVisited('dots');st={cash:0,weeks:52,round:0,speed:1,ultCd:0,hotCd:0,hotT:0,pops:0,spawnT:0,hurt:0,flash:0,stage:0};resize();newGame();new ResizeObserver(resize).observe(el);
let lastT=null;
scene(el,(_dt,t)=>{if(!V||!V.w){resize();if(!V||!V.w)return}const rdt=lastT==null?0:Math.min(.05,Math.max(0,t-lastT));lastT=t;const gdt=rdt*st.speed;
 if(rev.t<1){rev.t=Math.min(1,rev.t+(RM?1:rdt/1.7));const u=ease(rev.t);cam={z:lerp(camA.z,camB.z,u),x:lerp(camA.x,camB.x,u),y:lerp(camA.y,camB.y,u)};buildFog(rev.s,u)}
 if(!over&&running&&gdt>0){prep();let rem=gdt;while(rem>1e-6&&!over){const hh=Math.min(rem,1/60);sim(hh);rem-=hh}}
 tickFx(gdt);render(t);hud()});
})();
</script>
