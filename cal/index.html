    if(!tb.flat){moveTo(c2,tb.x,tb.y,c2.sp*.9,dt);if(Math.hypot(c2.x-tb.x,c2.y-tb.y)<5||p.t>1.4){tb.flat=1;tb.x+=3;
        p.horn={x:tb.x,y:tb.y-4,vx:34,vy:-70,a:0,va:9,gy:tb.y+2,rest:0};p.txt.push({s:'BWAMP!',x:tb.x+6,y:tb.y-14,t:0});shake=.45;p.hitT=p.t}}
    else{moveTo(c2,c2.x+6,c2.y,10,dt);if(p.t-p.hitT>1&&!p.won){p.won=1;p82Win()}}}
  function p82Win(){const p=P,five=p.lat>=5;p8Go('done');celebrate(['#FDB515','#003262','#fff']);party=4;stunt(five?'THE PLAY':'GO BEARS');
    if(five&&!p82Done){p82Done=true;store.set('shasan.cal.play1982',true);p82Tag()}
    flash(five?'THE PLAY':'TOUCHDOWN!',five?`${p8Pl(p.lat,'LATERAL')} &middot; 1982 LIVES`:`${p8Pl(p.lat,'LATERAL')} &middot; THE REAL ONE HAD 5`,0,0,1);
    setTimeout(()=>{if(mode==='p82'&&P===p)p82End(true)},2600)}
  function p82End(win){const p=P;ban.hidden=true;cue.hidden=true;const five=win&&p.lat>=5;
    G.played={win,lat:p.lat,five};G.drives.push({r:win?'PLAY':'DOWN',y:0});
    if(win){G.cal=p.score;if(G.cal===G.fur)G.cal++}G.clock=0;final()}
  function p8Best(){const p=P,c2=p.c;let best=null,bs=-1e9;p.cal.forEach(o=>{if(o===c2||o.down>0)return;const d=Math.hypot(o.x-c2.x,o.y-c2.y);if(d>LAT_R||d<3)return;let m=99;p.fur.forEach(e=>{if(e.down>0)return;m=Math.min(m,Math.hypot(e.x-o.x,e.y-o.y))});const s=Math.min(m,30)-d*.15;if(s>bs){bs=s;best=o}});return best}
  function p8Lat(to){const p=P;if(!p||p.ph!=='run'||p.ball.st!=='held')return;const c2=p.c;to=to||p8Best();if(!to)return;
    const d=Math.hypot(to.x-c2.x,to.y-c2.y),dur=.22+d/240,tx=to.x+to.vx*dur,ty=cl(to.y+to.vy*dur,FT+4,FB-4);
    p.ball={st:'pitch',x0:c2.x,y0:c2.y,tx,ty,k:0,dur,to};p.lat++;
    if(p.wrap){c2.down=1;p.wrap.d.down=1.2;p.wrap=null}
    cue.hidden=true;p.cueT=0;
    if(tx>c2.x+6&&p.fwd<2){p.fwd++;p.txt.push({s:'FORWARD?',x:c2.x,y:c2.y-14,t:0})}else if(p.lat===5)p.txt.push({s:'FIVE!',x:c2.x,y:c2.y-14,t:0});
    p82Hud()}
  function p82Pointer(pos,down){const p=P;if(!p||p.ph!=='run')return;
    if(down){const c2=p.c;let best=null,bd=16;p.cal.forEach(o=>{if(o===c2||o.down>0)return;const d=Math.hypot(o.x-pos.x,o.y-pos.y);if(d<bd){bd=d;best=o}});
      if(best&&p.ball.st==='held'&&Math.hypot(best.x-c2.x,best.y-c2.y)<=LAT_R)return p8Lat(best);
      if(p.wrap&&p.ball.st==='held')return p8Lat(null);
      p.drag=1}
    if(p.drag||down)p.steer={v:cl(pos.y,FT+4,FB-4),t:.8}}
  function bandGuy(sx,py,m,tromb,t){sx=Math.round(sx);py=Math.round(py);if(sx<-10||sx>W+10)return;
    if(m.flat){x.fillStyle='rgba(0,0,0,.3)';x.fillRect(sx-3,py+3,7,2);x.fillStyle=BAND[0];x.fillRect(sx-3,py,6,3);x.fillStyle='#fff';x.fillRect(sx+3,py,2,2);if(!tromb){x.fillStyle=BRASS;x.fillRect(sx-5,py+2,2,1)}return}
    guy(sx,py,BAND,false,t,Math.hypot(m.vx,m.vy)>3,false);x.fillStyle='#fff';x.fillRect(sx,py-9,1,2);
    x.fillStyle=BRASS;if(tromb){x.fillRect(sx-9,py-3,8,1);x.fillRect(sx-9,py-1,8,1);x.fillRect(sx-10,py-4,2,4)}
    else if(m.inst===0)x.fillRect(sx+2,py-3,2,3);else if(m.inst===1){x.fillRect(sx-3,py-4,2,2);x.fillRect(sx-4,py-3,1,1)}else{x.fillStyle='#eee';x.fillRect(sx+2,py-2,3,3);x.fillStyle=BAND[0];x.fillRect(sx+3,py-1,1,1)}}
  function drawHorn(h){const ca=Math.cos(h.a),sa=Math.sin(h.a);x.fillStyle=BRASS;for(let i=-5;i<=5;i++)x.fillRect(Math.round(h.x-cam+ca*i),Math.round(h.y+sa*i),1,1);x.fillRect(Math.round(h.x-cam+ca*6)-1,Math.round(h.y+sa*6)-1,3,3)}
  function drawP82(t,dt){const p=P,b=p.ball;const fx=(b.st==='air'||b.st==='pitch')?lerp(b.x0,b.tx,b.k):p.c.x;
    cam+=(cl(fx-100,0,WW-W)-cam)*.12;
    x.save();if(shake>0)x.translate(Math.round((R()-.5)*3),Math.round((R()-.5)*3));field(t,dt);
    const L=[];p.cal.forEach(o=>L.push([o,'c']));p.fur.forEach(o=>L.push([o,'f']));p.band.forEach(o=>L.push([o,'b']));if(p.tb)L.push([p.tb,'t']);
    L.sort((a,q)=>a[0].y-q[0].y).forEach(([o,k])=>{const sx=o.x-cam;if(k==='c'||k==='f')guy(sx,o.y,k==='c'?CAL:FUR,b.st==='held'&&o===p.c,t,Math.hypot(o.vx,o.vy)>6,o.down>0);else bandGuy(sx,o.y,o,k==='t',t)});
    if(b.st==='held'&&p.c&&p.c.nm&&p.c.down<=0)word(x,p.c.nm,p.c.x-cam,p.c.y-16,1,'#FDB515','#000');
    if(b.st==='air'||b.st==='pitch'){const k=b.k,gx=lerp(b.x0,b.tx,k),gy=lerp(b.y0,b.ty,k),by=gy-Math.sin(k*Math.PI)*(b.st==='air'?18:6);
      x.fillStyle='rgba(0,0,0,.35)';x.fillRect((gx-cam)|0,(gy+3)|0,2,1);x.fillStyle='#8a4b1f';x.fillRect((gx-cam)|0,by|0,3,2)}
    if(p.ph==='run'&&b.st==='held'){const c2=p.c;
      if(p.wrap){const f=Math.max(0,1-p.wrap.t/p.wrap.dur);x.lineWidth=1;x.strokeStyle=((t*10)|0)%2?'#ff6b5e':'#fff';x.beginPath();x.arc(c2.x-cam,c2.y-2,3+f*14,0,7);x.stroke()}
      if(p.wrap||p.cueT>0){const best=p8Best();p.cal.forEach(o=>{if(o===c2||o.down>0||Math.hypot(o.x-c2.x,o.y-c2.y)>LAT_R)return;const ax=(o.x-cam)|0,ay=(o.y-13)|0;x.fillStyle=o===best?Y:'#fff';x.fillRect(ax-2,ay,5,1);x.fillRect(ax-1,ay+1,3,1);x.fillRect(ax,ay+2,1,1)})}
      if(p.steer){x.fillStyle=Y;x.fillRect((c2.x-cam+8)|0,p.steer.v|0,2,1)}}
    if(p.horn)drawHorn(p.horn);
    p.txt.forEach(o=>word(x,o.s,o.x-cam,o.y,o.sc||1,o.sc?'#FDB515':'#fff','#000'));
    conf.forEach(q=>{x.fillStyle=q.c;x.fillRect(q.x|0,q.y|0,1,2)});x.restore()}

  /* ---------- wiring ---------- */
  $('go').addEventListener('click',start);$('wld').addEventListener('click',toWorlds);rplB.addEventListener('click',startReplay);
  const posOf=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W+cam,y:(e.clientY-r.top)/r.height*H}};
  const poke=()=>{idleT=0};
  el.addEventListener('pointerdown',e=>{poke();if(e.target.closest&&e.target.closest('a,button,.c67-sel,.c67-end'))return;
    if(mode==='p82'&&P){e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}return p82Pointer(posOf(e),true)}
    if(mode!=='play'||!S)return;act(posOf(e))});
  el.addEventListener('pointermove',e=>{if(mode==='p82'&&P&&P.drag)p82Pointer(posOf(e),false)});
  const pup=()=>{if(P)P.drag=0};el.addEventListener('pointerup',pup);el.addEventListener('pointercancel',pup);
  document.addEventListener('keydown',e=>{poke();const k=e.key,onBtn=!!(e.target&&e.target.closest&&e.target.closest('button,a'));
    if(mode==='p82'){if(!P)return;if(k==='Escape'){e.preventDefault();return toSplash()}
      if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();const cc=P.c;if(cc)P.steer={v:cl(cc.y+(k==='ArrowUp'?-18:18),FT+4,FB-4),t:.6};return}
      if((k===' '||k==='Enter')&&!onBtn){e.preventDefault();if(!e.repeat)p8Lat(null)}return}
    if(mode==='splash'){if((k==='Enter'||k===' ')&&!onBtn){e.preventDefault();start()}return}
    if(mode!=='play'||!S)return;if(k==='Escape'){e.preventDefault();return toSplash()}
    if(S.ph==='call'&&k>='1'&&k<='4'){e.preventDefault();return pick(+k-1)}
    if(S.ph==='call'&&(k==='s'||k==='S')){e.preventDefault();return shuffle()}
    if(S.ph==='choice'&&k>='1'&&k<='3'){e.preventDefault();return choose(+k-1)}
    if((k==='r'||k==='R')&&S.ph==='dead'&&!rplB.hidden){e.preventDefault();return startReplay()}
    if((k==='ArrowUp'||k==='ArrowDown')&&S.ph==='live'&&!S.def){const h=holder();if(h&&(h!==S.O.QB||S.O.QB.scr)){e.preventDefault();S.steer={v:cl(h.y+(k==='ArrowUp'?-16:16),FT+4,FB-4),t:.7}}return}
    if(k===' '||k==='Enter'){if(onBtn&&(S.ph==='call'||S.ph==='choice'||S.ph==='dead'&&e.target===rplB))return;e.preventDefault();if(e.repeat)return;act(null)}});
  toSplash();
  let last=null;const frame=(_,t)=>{const d=last==null?0:Math.min(.05,Math.max(0,t-last));last=t;update(d);draw(t,d)};
  frame(0,0);scene(el,frame);
})();
</script>
