.s66 .h-top{position:relative;width:82cqw;height:13.6cqw;flex:none}
.s66 .h-logo{display:block;width:100%;height:100%;cursor:pointer}
.s66 .h-splash{position:absolute;left:79%;top:73%;--k:1;font-family:'Press Start 2P',monospace;font-size:1.35cqw;color:#ffff55;text-shadow:.22cqw .22cqw 0 #3f3f15;transform:translate(-50%,-50%) rotate(-17deg);white-space:nowrap;animation:s66-p .5s ease-in-out infinite alternate;pointer-events:none}
@keyframes s66-p{from{transform:translate(-50%,-50%) rotate(-17deg) scale(var(--k))}to{transform:translate(-50%,-50%) rotate(-17deg) scale(calc(var(--k)*1.09))}}
.s66 .h-sub{font-family:'Silkscreen',monospace;font-size:2.9cqw;line-height:1;letter-spacing:.16em;color:#ececec;text-shadow:.18cqw .18cqw 0 #2a2a2a;text-align:center;pointer-events:none;margin:-.2cqw 0 1cqw}
.s66 .h-list{width:52cqw;background:rgba(0,0,0,.55);border-block:.3cqw solid #000;padding:.7cqw;display:grid;gap:.45cqw}
.s66 .h-w{display:grid;grid-template-columns:5.2cqw 1fr auto;gap:1.3cqw;align-items:center;padding:.35cqw .6cqw;border:.3cqw solid transparent;cursor:pointer;line-height:1;background:none;color:inherit;font:inherit;text-align:left}
.s66 .h-w.sel{border-color:#fff;background:rgba(255,255,255,.07)}
.s66 .h-w:focus-visible{outline:.3cqw solid #f5f543}
.s66 .h-w canvas{width:5.2cqw;height:5.2cqw;image-rendering:pixelated}
.s66 .h-w canvas.h-mk{image-rendering:auto}
.s66 .h-w b{display:block;font-weight:400;font-size:2.8cqw;line-height:1}
.s66 .h-w em{font-style:normal;font-size:2.2cqw;color:#ffff55}
.s66 .h-ck{display:inline-block;width:.85cqw;height:1.6cqw;border:solid #7ddc7d;border-width:0 .4cqw .4cqw 0;transform:rotate(45deg) translateY(-.25cqw);opacity:.85}
.s66 .h-btn{font:400 2.8cqw 'VT323',monospace;color:#fff;background:#6f6f6f;border:.3cqw solid #000;box-shadow:inset .3cqw .3cqw 0 #a8a8a8,inset -.3cqw -.3cqw 0 #444;padding:.45cqw .8cqw;text-shadow:.2cqw .2cqw 0 #3a3a3a;cursor:pointer;text-align:center;display:block;line-height:1.1}
.s66 .h-btn:hover,.s66 .h-btn:focus-visible{background:#7d86c9;box-shadow:inset .3cqw .3cqw 0 #b9c1f5,inset -.3cqw -.3cqw 0 #4a518a;outline:none}
.s66 .h-play{width:40cqw;margin-top:.6cqw}
.s66 .h-ver{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:clamp(13px,1.35vw,20px);color:#dcdcdc;text-shadow:1px 1px 0 #222;pointer-events:none}
.s66 .h-cnr{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.s66 .h-bk{width:clamp(22px,2.2vw,32px);height:clamp(22px,2.2vw,32px);padding:0;border:0;background:none;cursor:pointer;opacity:.85}
.s66 .h-bk canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.s66 .h-bk:hover,.s66 .h-bk:focus-visible{opacity:1;outline:none;filter:drop-shadow(0 0 3px #ffff55)}
.s66 .h-load{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:1.3cqw;image-rendering:pixelated;font-size:3cqw;text-shadow:.25cqw .25cqw 0 #3a3a3a;text-align:center;padding:0 6cqw;background:rgba(20,14,8,.78);box-shadow:0 0 0 200vmax rgba(20,14,8,.78)}

.s66 .h-load small{font-size:2.3cqw;color:#ddd}
.s66 .h-pb{display:block;width:30cqw;height:1cqw;background:#444;border:.2cqw solid #000}
.s66 .h-pb b{display:block;height:100%;width:0;background:#55ff55;transition:width 1.1s linear}
.s66 .h-book{position:absolute;inset:0;background:rgba(0,0,0,.5);box-shadow:0 0 0 200vmax rgba(0,0,0,.5);display:grid;place-items:center;z-index:6}
.s66 .h-page{position:relative;width:56cqw;max-height:54cqw;overflow:auto;background:#f1e3c2;border:.4cqw solid #5a3a1a;box-shadow:inset 0 0 0 .4cqw #c9ad7c,.8cqw .8cqw 0 rgba(0,0,0,.4);color:#2a1d0e;padding:2cqw 2.6cqw;display:grid;gap:.9cqw;font-size:2.4cqw;line-height:1.1;text-align:left}
.s66 .h-page h3{margin:0;font-weight:400;font-family:'Press Start 2P',monospace;font-size:2.3cqw;color:#2a1d0e}
.s66 .h-t2{color:#7a4b12;margin-top:-.4cqw}
.s66 .h-ch{display:grid;gap:.6cqw;border-block:.25cqw dashed #b8955c;padding-block:.8cqw}
.s66 .h-ch div{display:grid;grid-template-columns:1fr auto;column-gap:1cqw;align-items:baseline}
.s66 .h-ch small{color:#8a6a3a;font-size:2cqw}
.s66 .h-ch b{font-weight:400;display:block}
.s66 .h-ch span{grid-column:1/-1;color:#6a5232;font-size:2.1cqw}
.s66 .h-lk{display:block;text-align:center;text-decoration:none;color:#fff;font-size:2.4cqw;padding:.6cqw 0;border:.3cqw solid #000;background:#2b5f9e}
.s66 .h-rs{justify-self:start;font:400 2cqw 'VT323',monospace;color:#7a4b12;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.s66 .h-x{position:absolute;right:1cqw;top:.8cqw;font:400 2.6cqw 'VT323',monospace;background:#7a4b12;color:#f1e3c2;border:0;width:3.4cqw;height:3.4cqw;cursor:pointer}
@container (max-width:520px){

  .s66 .h-list{width:76cqw;padding:.5cqw;gap:.25cqw}
  .s66 .h-w{grid-template-columns:5.4cqw 1fr auto;gap:1.8cqw;padding:.2cqw .6cqw}
  .s66 .h-w canvas{width:6cqw;height:6cqw}
  .s66 .h-w b{font-size:4.4cqw}
  .s66 .h-w em{font-size:2.9cqw}
  .s66 .h-ck{width:1.2cqw;height:2.3cqw}
  .s66 .h-play{width:68cqw;font-size:3.8cqw;padding:.25cqw .8cqw}
  .s66 .h-load{font-size:4cqw}
  .s66 .h-load small{font-size:3.2cqw}
  .s66 .h-pb{width:52cqw;height:1.6cqw}
  .s66 .h-btn{font-size:3.6cqw}
  .s66 .h-page{width:88cqw;max-height:58cqw;font-size:3.2cqw;padding:2.4cqw 3cqw}
  .s66 .h-page h3{font-size:3.2cqw}
  .s66 .h-ch span,.s66 .h-ch small{font-size:2.9cqw}
  .s66 .h-lk{font-size:3.2cqw}
  .s66 .h-rs{font-size:3cqw}
  .s66 .h-x{width:5cqw;height:5cqw;font-size:3.4cqw}
}

@media (orientation:portrait){

<script>
(()=>{
  /* ===== SPLASH LINES: one set per world; the line follows the selected world ===== */
  const SPLASH={
    dots:['Paying 190+ countries!','Now with Series A!','Payouts in any currency!','Ship it!','Founder mode!','Hiring!','Also try Retro Bowl!','GG!','Respawning...'],
    cal:['Go Bears!','Geaux Bears!','Beat the Furd!','The Play lives!','Fiat Lux!','Press Play!','Now in 3D!'],
    cmu:['Yinz ready?','City of bridges!','Paint the Fence!','My heart is in the work!','Now with 446 bridges!','100% bug-free (citation needed)!','GG!']
  };
  /* ================================================================================ */
  const el=document.getElementById('hub');if(!el)return;
  const q=s=>el.querySelector(s);

  /* ---------- 16px block textures ---------- */
  const R0=rng(6161),cl=v=>Math.max(0,Math.min(255,v|0));
  function tx(fn){const k=document.createElement('canvas');k.width=k.height=16;const g=k.getContext('2d');fn(g);return k}
  function nz(g,c0,s,x0=0,y0=0,w=16,h=16){for(let y=y0;y<y0+h;y++)for(let i=x0;i<x0+w;i++){const v=(R0()-.5)*s;g.fillStyle=`rgb(${cl(c0[0]+v)},${cl(c0[1]+v)},${cl(c0[2]+v)})`;g.fillRect(i,y,1,1)}}
  const frame=(g,col)=>{g.strokeStyle=col;g.lineWidth=1;g.strokeRect(.5,.5,15,15)};
  const A32=k=>{const d=k.getContext('2d').getImageData(0,0,16,16).data,a=new Uint32Array(256);for(let i=0;i<256;i++)a[i]=(255<<24|d[i*4+2]<<16|d[i*4+1]<<8|d[i*4])>>>0;return a};
  const T=(k,lit)=>({a:A32(k),lit:lit?A32(lit):null});
  const tex={
    grassTop:T(tx(g=>nz(g,[95,159,53],34))),
    grassSide:T(tx(g=>{nz(g,[134,96,62],30);nz(g,[95,159,53],30,0,0,16,3);for(let i=0;i<16;i++)if(R0()<.5){g.fillStyle='rgb(88,150,50)';g.fillRect(i,3,1,1+(R0()*2|0))}})),
    dirt:T(tx(g=>nz(g,[134,96,62],30))),
    stone:T(tx(g=>{nz(g,[125,125,125],24);for(let k=0;k<10;k++){g.fillStyle='rgba(70,70,70,.55)';g.fillRect(R0()*15|0,R0()*15|0,2,1)}})),
    sand:T(tx(g=>nz(g,[219,207,163],18))),
    gravel:T(tx(g=>{nz(g,[128,122,118],44)})),
    logTop:T(tx(g=>{nz(g,[178,142,92],12);g.strokeStyle='rgba(110,80,45,.85)';[6,3.5].forEach(r=>g.strokeRect(8-r,8-r,r*2,r*2))})),
    logSide:T(tx(g=>{nz(g,[104,76,46],18);g.fillStyle='rgba(50,34,18,.6)';for(let i=1;i<16;i+=3)g.fillRect(i,0,1,16)})),
    leaves:T(tx(g=>{nz(g,[58,138,52],46);for(let k=0;k<26;k++){g.fillStyle='rgba(20,60,20,.75)';g.fillRect(R0()*16|0,R0()*16|0,1,1)}})),
    euc:T(tx(g=>{nz(g,[92,140,104],40);for(let k=0;k<22;k++){g.fillStyle='rgba(40,70,50,.7)';g.fillRect(R0()*16|0,R0()*16|0,1,1)}})),
    plank:T(tx(g=>{nz(g,[176,130,74],16);g.fillStyle='rgba(90,58,28,.7)';for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1)})),
    brick:T(tx(g=>{g.fillStyle='#b9b0a0';g.fillRect(0,0,16,16);for(let r=0;r<4;r++)for(let k=-1;k<3;k++)nz(g,[176,92,66],22,k*8+(r%2?4:0),r*4,7,3)})),
    roof:T(tx(g=>{nz(g,[166,78,44],18);g.fillStyle='rgba(80,30,15,.6)';for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1)})),
    slate:T(tx(g=>{nz(g,[70,72,82],14);g.fillStyle='rgba(30,30,40,.6)';for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1)})),
    quartz:T(tx(g=>{nz(g,[234,228,214],7);g.fillStyle='rgba(180,170,150,.35)';g.fillRect(0,7,16,1)})),
    copper:T(tx(g=>{nz(g,[92,164,142],20);for(let k=0;k<12;k++){g.fillStyle='rgba(160,215,195,.6)';g.fillRect(R0()*15|0,R0()*15|0,2,2)}})),
    ink:T(tx(g=>nz(g,[40,40,44],10))),
    yel:T(tx(g=>{nz(g,[245,245,67],10);frame(g,'rgba(150,150,20,.55)')}),tx(g=>{nz(g,[255,255,120],8);frame(g,'rgba(200,200,60,.6)')})),
    navy:T(tx(g=>nz(g,[0,50,98],12))),
    cal:T(tx(g=>nz(g,[253,181,21],14))),
    turf:T(tx(g=>{nz(g,[74,152,58],14,0,0,16,8);nz(g,[92,172,70],14,0,8,16,8)})),
    steel:T(tx(g=>nz(g,[118,130,146],12))),
    win:T(tx(g=>{nz(g,[46,74,112],14);g.fillStyle='rgba(160,200,240,.55)';g.fillRect(2,2,5,5);g.fillRect(9,2,5,5);g.fillRect(2,9,5,5);g.fillRect(9,9,5,5);frame(g,'rgba(20,24,30,.9)')}),
          tx(g=>{nz(g,[40,36,40],10);g.fillStyle='rgb(255,214,120)';g.fillRect(2,2,5,5);g.fillRect(9,9,5,5);g.fillStyle='rgb(240,170,80)';g.fillRect(9,2,5,5);g.fillStyle='rgb(70,60,60)';g.fillRect(2,9,5,5);frame(g,'rgba(20,20,20,.9)')})),
    swin:T(tx(g=>{nz(g,[110,124,142],10);g.fillStyle='rgba(190,222,248,.7)';for(let y=2;y<16;y+=4)for(let i=1;i<16;i+=4)g.fillRect(i,y,2,2)}),
           tx(g=>{nz(g,[34,36,46],8);for(let y=2;y<16;y+=4)for(let i=1;i<16;i+=4){const on=R0()<.55;g.fillStyle=on?(R0()<.5?'rgb(255,220,140)':'rgb(250,240,200)'):'rgb(50,52,66)';g.fillRect(i,y,2,2)}})),
    bridge:T(tx(g=>{nz(g,[255,184,28],14);g.fillStyle='rgba(120,80,0,.55)';for(let i=2;i<16;i+=5)g.fillRect(i,0,1,16);g.fillRect(0,0,16,1);g.fillRect(0,15,16,1)}),
             tx(g=>{nz(g,[200,140,30],12);g.fillStyle='rgba(90,60,0,.6)';for(let i=2;i<16;i+=5)g.fillRect(i,0,1,16);g.fillStyle='rgb(255,250,200)';g.fillRect(0,0,16,1);for(let i=1;i<16;i+=5)g.fillRect(i,1,2,1)}))
  };
  tex.door=T(tx(g=>{nz(g,[58,46,38],10);g.fillStyle='rgba(20,14,10,.7)';g.fillRect(7,0,2,16);g.fillStyle='rgb(245,245,67)';g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);g.fillRect(15,0,1,16);g.fillStyle='rgb(245,245,67)';g.fillRect(5,8,1,2);g.fillRect(10,8,1,2)}));

  for(const ch of 'SAHIL HASAN'){const gl=GL[ch];gl.forEach((row,y)=>[...row].forEach((v,xx)=>{if(v=='#'){cells.push([cols+xx,y]);set.add((cols+xx)+','+y)}}));cols+=gl[0].length+1}
  cols-=1;
  function drawLogo(){const r=logo.getBoundingClientRect(),Wl=r.width,Hl=r.height;if(!(Wl>0&&Hl>0))return;const d=devicePixelRatio||1;
    logo.width=Math.round(Wl*d);logo.height=Math.round(Hl*d);const x=logo.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,Wl,Hl);
    const DX=.22,DY=1.3,OL=.26,b=Math.min(Wl/(cols+DX+OL*2+.4),Hl/(7+DY+OL*2+.2));if(!(b>0))return;
    const ox=(Wl-(cols+DX)*b)/2,oy=(Hl-(7+DY)*b)/2,o=OL*b,NS=Math.max(3,Math.round(b*DY));
    x.fillStyle='#0a0a0a';for(let k=0;k<=NS;k++){const ex=k/NS*DX*b,ey=k/NS*DY*b;cells.forEach(([c0,y])=>x.fillRect(ox+c0*b+ex-o,oy+y*b+ey-o,b+2*o,b+2*o))}
    for(let k=NS;k>=1;k--){const ex=k/NS*DX*b,ey=k/NS*DY*b,sh=.55-.22*(k/NS);cells.forEach(([c0,y])=>{for(let sxi=0;sxi<4;sxi++){const v=hash(c0*4+sxi,y*31+k);const c=Math.round((92+v*34)*sh*1.6);x.fillStyle=`rgb(${c},${c},${c+3})`;x.fillRect(ox+c0*b+ex+sxi*b/4,oy+y*b+ey,b/4+.6,b/NS*DY+.8)}})}
    const s4=b/4;cells.forEach(([c0,y])=>{const X=ox+c0*b,Y=oy+y*b;for(let j=0;j<4;j++)for(let i=0;i<4;i++){const gx=c0*4+i,gy=y*4+j,v=hash(gx,gy),v2=hash(gx>>1,gy>>1),lit=1.2-((y*4+j)/28)*.42;
        let c=150+(v-.5)*26;if(v2<.28)c=112+v*22;else if(v>.93)c=196;c*=lit;const cc=Math.min(255,Math.round(c));x.fillStyle=`rgb(${cc},${cc},${Math.min(255,cc+3)})`;x.fillRect(X+i*s4,Y+j*s4,s4+.5,s4+.5)}
      if(!set.has(c0+','+(y-1))){x.fillStyle='rgba(255,255,255,.35)';x.fillRect(X,Y,b,Math.max(1,b*.13))}
      if(!set.has((c0-1)+','+y)){x.fillStyle='rgba(255,255,255,.16)';x.fillRect(X,Y,Math.max(1,b*.12),b)}
      if(!set.has(c0+','+(y+1))){x.fillStyle='rgba(0,0,0,.22)';x.fillRect(X,Y+b-Math.max(1,b*.12),b,Math.max(1,b*.12))}})}
  drawLogo();new ResizeObserver(drawLogo).observe(logo);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitSpl());
  /* bio button: a Minecraft-style book, 16x16 pixels drawn at 3x */
  (()=>{const g=q('.h-bk canvas').getContext('2d'),pal={D:'#2e1a0b',S:'#4a2a12',L:'#b07a3e',H:'#9a6532',B:'#7a4a22',P:'#f1e3c2',p:'#bfa97c'};
    ['','.DDDDDDDDDDDD','.DSHHHHHHHHHDP','.DSHBBBBBBBBDPp','.DLHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DLHBBBBBBBBDPp','.DSHBBBBBBBBDPp','.DDDDDDDDDDDDPp','..PPPPPPPPPPPPp','...pppppppppppp']
      .forEach((r,j)=>[...r].forEach((c,i)=>{if(pal[c]){g.fillStyle=pal[c];g.fillRect(i*3,j*3,3,3)}}))})();

  /* ---------- menu ---------- */
  function renderList(){list.innerHTML='';WORLDS.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='h-w'+(i==sel?' sel':'');b.setAttribute('role','option');b.setAttribute('aria-selected',String(i==sel));
      const ic=document.createElement('canvas');ic.width=ic.height=w.hi?64:16;if(w.hi)ic.className='h-mk';w.ic(ic.getContext('2d'));
      const tag=visited(w)?'<em aria-label="Played"><i class="h-ck"></i></em>':(w.k=='dots'?'<em>NEW</em>':'<em></em>');
      b.innerHTML=`<span></span><span style="min-width:0"><b>${w.n}</b></span>${tag}`;b.firstChild.replaceWith(ic);
      b.addEventListener('click',()=>{if(sel==i){go(i);return}pick(i)});list.appendChild(b)})}
  function pick(i){sel=i;store.set(SK,i);renderList();setSplash(i);swap(sceneFor(i));const r=list.children[i];if(r&&el.contains(document.activeElement))r.focus({preventScroll:true})}
  function go(i){if(busy)return;busy=true;book.hidden=true;sel=i;store.set(SK,i);swap(sceneFor(i));const w=WORLDS[i];title.hidden=true;
    const pb=ld.querySelector('.h-pb b'),msg=ld.querySelector('.h-msg'),sub=ld.querySelector('.h-sub2');
    ld.hidden=false;const lm=ld.querySelector('.h-lmk');lm.hidden=w.k!='dots';if(w.k=='dots'&&!lm.innerHTML)lm.innerHTML=markSVG('width:100%;height:100%');
    msg.textContent='Loading terrain...';sub.textContent=w.load+'...';pb.style.transition='none';pb.style.width='0';void pb.offsetWidth;pb.style.transition='';
    requestAnimationFrame(()=>{pb.style.width='100%'});
    setTimeout(()=>{location.href=w.href},RM?60:1250)}
  /* coming back with the browser's back button: restore the menu */
  addEventListener('pageshow',e=>{if(!e.persisted)return;ld.hidden=true;title.hidden=false;busy=false;renderList()});
  play.addEventListener('click',()=>go(sel));
  function bookRows(){chEl.innerHTML='';['ucb','cmu','dots'].map(k=>WORLDS.find(w=>w.k==k)).forEach(w=>{const d=document.createElement('div');d.innerHTML=`<b>${w.n}</b><small>${w.yr}</small><span>${w.d}</span>`;chEl.appendChild(d)})}
  function openBook(){bookRows();book.hidden=false;q('.hub-close').focus({preventScroll:true})}
  function closeBook(){book.hidden=true;q('.h-bk').focus({preventScroll:true})}
  q('.hub-bk').addEventListener('click',openBook);logo.addEventListener('click',openBook);q('.hub-close').addEventListener('click',closeBook);book.addEventListener('click',e=>{if(e.target===book)closeBook()});
  let arm=0;q('.hub-reset').addEventListener('click',e=>{const b=e.currentTarget;if(!arm){arm=1;b.textContent='Tap again to reset';setTimeout(()=>{arm=0;b.textContent='Reset worlds'},3000);return}
    arm=0;b.textContent='Reset worlds';WORLDS.forEach(w=>store.set('shasan.visited.'+w.vk,false));renderList()});
  /* keyboard works on the whole page: arrows pick a world, Enter plays, B opens the bio */
  document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(!book.hidden){if(e.key=='Escape'){e.preventDefault();closeBook()}return}
    if(busy)return;
    if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();pick((sel+(e.key=='ArrowDown'?1:2))%3);const r=list.children[sel];if(r)r.focus({preventScroll:true})}
    else if(e.key=='Enter'){const t=e.target;if(t===document.body||t===document.documentElement||(t.classList&&t.classList.contains('h-w'))){e.preventDefault();go(sel)}}
    else if(e.key=='b'||e.key=='B'){e.preventDefault();openBook()}});
  const spl=q('.h-splash'),SPK={dots:'dots',ucb:'cal',cmu:'cmu'};let lines=SPLASH.dots,si=0;
  function fitSpl(){spl.style.setProperty('--k','1');const w=spl.offsetWidth,max=q('.h-top').clientWidth*.3;spl.style.setProperty('--k',w>0&&w>max?(max/w).toFixed(3):'1')}
  function showSpl(t){spl.textContent=t;fitSpl()}
  function setSplash(i){lines=SPLASH[SPK[WORLDS[i].k]];si=0;showSpl(lines[RM?0:(Math.random()*lines.length|0)]);si=lines.indexOf(spl.textContent)}
  new ResizeObserver(fitSpl).observe(el);
  if(!RM)setInterval(()=>{si=(si+1)%lines.length;showSpl(lines[si])},2600);
  renderList();setSplash(sel);sc=sceneFor(sel);yaw=lookAt(ORDER[sc]);
  scene(el,(dt,t)=>{yaw+=dt*.055*hfov()/1.2217;since+=dt;if(!RM&&since>10)swap((sc+1)%ORDER.length);
    if(lastR<0||t-lastR>1/22){P.render(SCENES[ORDER[sc]],yaw,t);lastR=t}});
})();
</script>
